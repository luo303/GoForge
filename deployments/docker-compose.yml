# GoForge 本地基础设施。
#
# 只包含有状态依赖：PostgreSQL、Redis、RabbitMQ。
# 开发期应用进程在宿主机用 `go run ./cmd/server` 运行，阶段六再把它作为服务加进来。
#
#   docker compose -f deployments/docker-compose.yml up -d     启动
#   docker compose -f deployments/docker-compose.yml ps        状态
#   docker compose -f deployments/docker-compose.yml down      停止（保留数据卷）
#   docker compose -f deployments/docker-compose.yml down -v   停止并删除数据卷（清空数据）

name: goforge

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: goforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-goforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goforge_dev_password}
      POSTGRES_DB: ${DB_NAME:-goforge}
      # 固定编码与排序规则，保证不同机器上的索引/排序行为一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-goforge} -d ${DB_NAME:-goforge}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: goforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: goforge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-goforge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-goforge_dev_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"      # AMQP
      - "${RABBITMQ_UI_PORT:-15672}:15672" # 管理界面 http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
