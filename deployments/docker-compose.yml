# MindOS 本地基础设施。
#
# PostgreSQL 使用 pgvector 镜像：向量检索与业务数据同库，不额外引入向量数据库。
# MinIO 存放上传的原始文档（STORAGE_DRIVER=minio 时必需），数据在 minio_data 卷里。
# Redis 为按需组件（当前未接入应用），保留服务但不影响启动。
#
# 开发期应用进程在宿主机运行：`cd backend && go run ./cmd/server`。
#
# 注意显式指定 env 文件：compose 默认只在自身所在目录找 .env，
# 而应用配置在 backend/.env，不带 --env-file 会退回下方的默认值。
#
#   docker compose --env-file backend/.env -f deployments/docker-compose.yml up -d     启动
#   docker compose --env-file backend/.env -f deployments/docker-compose.yml ps        状态
#   docker compose --env-file backend/.env -f deployments/docker-compose.yml down      停止（保留数据卷）
#   docker compose --env-file backend/.env -f deployments/docker-compose.yml down -v   停止并删除数据卷

name: mindos

services:
  postgres:
    # pgvector 官方镜像 = PostgreSQL 16 + vector 扩展，兼容官方 postgres 镜像的用法。
    image: pgvector/pgvector:pg16
    container_name: mindos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mindos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindos_dev_password}
      POSTGRES_DB: ${DB_NAME:-mindos}
      # 固定编码与排序规则，保证不同机器上的索引/排序行为一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mindos} -d ${DB_NAME:-mindos}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio:
    # 为什么是 pgsty/minio 而不是 minio/minio：官方 docker.io 镜像自 2025 年起
    # 不再对匿名拉取开放（HEAD manifest 返回 403），quay.io 也需要认证。
    # pgsty/minio 是 Pigsty 社区按上游源码重建的镜像，版本号与上游一致，
    # 这里按 release 标签固定，不跟 latest。
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: mindos-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mindos}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-mindos_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # 控制台 http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      # 镜像里带了 mc，用 readiness 探针判断，比 curl 更贴近"能读能写"。
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    # 7-alpine 是 7.x 的滚动标签：本地已有该镜像时不必再拉一次。
    # 代价是重建容器可能悄悄带上新的小版本；要复现某个具体版本时改回 7.4-alpine。
    image: redis:7-alpine
    container_name: mindos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mindos-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mindos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mindos_dev_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"      # AMQP
      - "${RABBITMQ_UI_PORT:-15672}:15672" # 管理界面 http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
